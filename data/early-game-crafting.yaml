# Enshrouded early-game crafting chains (tools, weapons, and the stations/materials behind them)
# Scope: start of game through the copper/bronze tier (Springlands -> Revelwood start).
# Game version: 1.0 (released 2026-10-15, PC + PS5). Recipes are the same on both platforms.
#
# confidence values:
#   confirmed      - two independent sources agree
#   single_source  - one current (1.0-era) source, no contradiction found
#   uncertain      - sources disagree, are unclear, or the field was not stated; see `note`
# Quantities are per craft. `output` defaults to 1 when omitted.

meta:
  compiled: 2026-11-21
  game_version: "1.0"
  sources:
    atw_handcraft: https://allthings.how/enshrouded-1-0-all-workbench-and-hand-crafting-recipes/   # updated 2026-10-22
    atw_early: https://allthings.how/enshrouded-1-0-the-early-game-from-starting-tomb-to-first-ancient-spire/  # updated 2026-10-19
    atw_blacksmith: https://allthings.how/enshrouded-1-0-all-blacksmith-recipes/   # updated 2026-10-22
    atw_bronze: https://allthings.how/enshrouded-1-0-how-to-make-bronze-bars/   # updated 2026-10-24
    atw_sheets: https://allthings.how/enshrouded-1-0-how-to-get-metal-sheets/   # updated 2026-10-16
    atw_scraps: https://allthings.how/enshrouded-1-0-best-early-game-metal-scraps-farm/   # updated 2026-10-19
    wiki_workbench: https://enshrouded.wiki.gg/wiki/Workbench   # edited 2026-10-15
    wiki_copper: https://enshrouded.wiki.gg/wiki/Copper_Bars   # edited 2026-10-15
    wiki_scraps: https://enshrouded.wiki.gg/wiki/Metal_Scraps   # edited 2026-05-15
    wiki_forge: https://enshrouded.wiki.gg/wiki/Forge   # edited 2025-08-31 (pre-1.0)

# ---------------------------------------------------------------------------
# Progression: the order things unlock in
# ---------------------------------------------------------------------------
progression:
  - step: 1
    where: Cinder Vault (starting tomb)
    action: Commune with the Flame
    unlocks: [flame_altar]
    sources: [atw_early]
    confidence: single_source
  - step: 2
    where: Starter cave after the Cinder Vault
    action: Break wooden crates; pick up Torn Cloth from scavengers
    unlocks: [campfire, tiny_backpack]
    sources: [atw_early]
    confidence: single_source
  - step: 3
    where: Return Beacon past the caves
    action: Reach it after leaving the Cinder Vault for the first time
    unlocks: [workbench]
    sources: [wiki_workbench]
    confidence: single_source
  - step: 4
    where: Your base
    action: Gather Twigs, Plant Fiber, Stone; craft first tools
    unlocks: [axe, pickaxe, bow, wooden_arrow]
    sources: [atw_early]
    confidence: uncertain
    note: Guide says you craft these here but does not state the exact unlock trigger.
  - step: 5
    where: Your base
    action: Place the Flame Altar (40x40x40 m build area)
    unlocks: [wooden_shield, ragged_shirt]
    sources: [atw_early, atw_handcraft]
    confidence: confirmed
  - step: 6
    where: Braelyn Bridge (north end), Ancient Vault
    action: Quest "Find the Sleeping Survivor"; wake Oswald Anders at the Cinder Vessel
    npc: Oswald Anders (Blacksmith)
    then: Craft a Summoning Staff (1 Twig), place him at base; give him a sheltered bed
    unlocks: [blacksmith_recipes, charcoal_kiln, forge, scrappy_pickaxe, scrappy_axe, scrappy_sword]
    sources: [atw_early, atw_blacksmith]
    confidence: confirmed
  - step: 7
    where: Blacksmith quest chain
    action: Quest "Crucible Needed For A Smelter"
    unlocks: [crucible, smelter, copper_bars]
    sources: [wiki_copper, atw_bronze]
    confidence: single_source
    note: Quest name from the wiki only; allthings agrees the Crucible gates the Smelter.
  - step: 8
    where: Revelwood (copper), Nomad Highlands shroud (tin)
    action: Pick up both Copper Ore and Tin Ore while owning a Smelter
    unlocks: [bronze_bars]
    sources: [atw_bronze]
    confidence: single_source
    note: Tin is not truly early game; listed so the bronze chain is complete.

# ---------------------------------------------------------------------------
# Stations
# ---------------------------------------------------------------------------
stations:
  flame_altar:
    crafted_at: hand
    ingredients: {stone: 5}
    unlock: Commune with the Flame in the Cinder Vault
    sources: [atw_handcraft, atw_early]
    confidence: confirmed
  campfire:
    crafted_at: hand
    ingredients: {wood_logs: 2}
    unlock: Break wooden crates in the starter cave
    sources: [atw_handcraft, atw_early]
    confidence: confirmed
  workbench:
    crafted_at: hand
    ingredients: {string: 3, wood_logs: 8}
    unlock: Reach the Return Beacon past the starter caves
    sources: [atw_handcraft, wiki_workbench]
    confidence: confirmed
    note: Must be placed inside a Flame Altar area.
  charcoal_kiln:
    crafted_at: blacksmith
    ingredients: {stone: 20}
    unlock: Rescue Oswald Anders (Blacksmith)
    sources: [atw_blacksmith, atw_early]
    confidence: confirmed
  forge:
    crafted_at: blacksmith
    ingredients: {stone: 30, metal_scraps: 10, charcoal: 10, wood_logs: 12}
    unlock: Rescue Oswald Anders (Blacksmith)
    sources: [atw_blacksmith, wiki_forge]
    confidence: confirmed
    note: Wiki also allows the Blacksmith Assistant to craft it.
  crucible:
    crafted_at: blacksmith
    ingredients: {lump_of_clay: 3, springlands_dirt: 3, sand: 5}
    unlock: Quest "Crucible Needed For A Smelter"
    sources: [atw_blacksmith, wiki_copper]
    confidence: single_source
    note: Any sand type (Fine Sand, Veilwater Basin Sand) works.
  smelter:
    crafted_at: blacksmith
    ingredients: {fired_bricks: 50, crucible: 1}
    unlock: Have a Crucible
    sources: [atw_blacksmith, atw_bronze]
    confidence: confirmed

# ---------------------------------------------------------------------------
# Intermediate materials (the chains)
# ---------------------------------------------------------------------------
materials:
  string:
    crafted_at: hand
    ingredients: {plant_fiber_or_paper_reed: 3}
    sources: [atw_handcraft]
    confidence: single_source
  metal_scraps:
    crafted_at: none
    obtain:
      - Scavenger drops (0-5 each, varies by type)
      - Metal urn pods in the Cinder Vault starting chamber (~5 each, respawn ~45 min)
      - Loose pickups in Rookmore (north past Braelyn Bridge)
    sources: [wiki_scraps, atw_scraps]
    confidence: uncertain
    note: Not craftable or mined. Sources disagree on which scavenger types drop scraps.
  charcoal:
    crafted_at: charcoal_kiln
    ingredients: {wood_logs: 12, dirt: 3}
    output: 10
    sources: [atw_blacksmith]
    confidence: single_source
    note: Hardwood or Palm logs and any regional dirt also work.
  wood_acid:
    crafted_at: charcoal_kiln
    ingredients: {wood_logs: 15, dirt: 3}
    output: 10
    sources: [atw_bronze]
    confidence: single_source
  fired_bricks:
    crafted_at: charcoal_kiln
    ingredients: {lump_of_clay: 1, wood_logs: 1}
    sources: [atw_bronze]
    confidence: uncertain
    note: Output per craft not stated.
  metal_sheets:
    crafted_at: forge
    ingredients: {metal_scraps: 2, charcoal: 2}
    craft_time_s: 90
    sources: [atw_sheets]
    confidence: uncertain
    note: The (pre-1.0) wiki Forge page does not list Metal Sheets as a Forge output. Output count implied, not stated.
  nails:
    crafted_at: blacksmith
    ingredients: {metal_scraps: 1}
    output: 2
    sources: [atw_blacksmith]
    confidence: uncertain
    note: Full ingredient list and station detail not stated.
  copper_bars:
    crafted_at: smelter
    ingredients: {copper_ore: 10, charcoal: 10}
    output: 10
    craft_time_s: 210
    sources: [wiki_copper, atw_bronze]
    confidence: confirmed
    note: Copper Ore is found in the Revelwood.
  tin_bars:
    crafted_at: smelter
    ingredients: {tin_ore: 10, charcoal: 10, wood_acid: 2}
    output: 10
    craft_time_s: 240
    sources: [atw_bronze]
    confidence: single_source
  bronze_bars:
    crafted_at: smelter
    ingredients: {copper_bars: 7, tin_bars: 3, charcoal: 10}
    output: 10
    craft_time_s: 240
    sources: [atw_bronze, wiki_copper]
    confidence: confirmed

